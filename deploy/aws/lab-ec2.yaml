AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Secured n8n AI agent lab on one EC2 instance in ap-southeast-1 (Singapore).
  Always on. Only TCP 8443 (HTTPS, webhook only) is reachable from the internet.
  There is no SSH: admin access is through SSM Session Manager.

Parameters:
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    Description: Who may reach port 8443. 0.0.0.0/0 is the whole internet. Narrow it if you can.
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large]
    Description: t3.medium (4 GB RAM) is comfortable for n8n plus the mocks.
  RepoUrl:
    Type: String
    Default: https://github.com/memonasif99/vulnerable-guarded-n8n-agent-lab.git
    Description: Git URL of the lab repository (must be public, or reachable without credentials).
  RepoBranch:
    Type: String
    Default: main
    Description: Branch to deploy.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023, resolved at deploy time.

Rules:
  SingaporeOnly:
    Assertions:
      - Assert: !Equals [!Ref "AWS::Region", ap-southeast-1]
        AssertDescription: Deploy this stack in ap-southeast-1 (Singapore).

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: n8n-agent-lab }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: n8n-agent-lab }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: n8n-agent-lab-public }]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: n8n-agent-lab }]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  LabSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: n8n agent lab - HTTPS webhook on 8443 only, no SSH
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          CidrIp: !Ref AllowedCidr
          Description: Lab webhook over HTTPS
      SecurityGroupEgress:
        # Outbound is needed for OS updates, Docker images and git.
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS out
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP out for package mirrors
      Tags: [{ Key: Name, Value: n8n-agent-lab }]

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Session Manager only: shell and port forwarding without SSH.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  ElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: n8n-agent-lab }]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 20
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true

  LabInstance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref PublicSubnet
          GroupSet: [!Ref LabSecurityGroup]
          AssociatePublicIpAddress: false
      Tags: [{ Key: Name, Value: n8n-agent-lab }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee -a /var/log/lab-bootstrap.log) 2>&1
          # Wait for the Elastic IP association so outbound traffic works.
          for i in $(seq 1 60); do curl -fsS -o /dev/null https://github.com && break; sleep 5; done
          dnf install -y git
          git clone --depth 1 -b "${RepoBranch}" "${RepoUrl}" /opt/lab
          /opt/lab/deploy/aws/bootstrap.sh "${ElasticIp.PublicIp}"

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref LabInstance

Outputs:
  WebhookUrl:
    Description: Public webhook (self-signed certificate)
    Value: !Sub https://${ElasticIp.PublicIp}:8443/webhook/support-agent
  InstanceId:
    Value: !Ref LabInstance
  ShellCommand:
    Description: Open a shell on the instance (no SSH needed)
    Value: !Sub aws ssm start-session --region ${AWS::Region} --target ${LabInstance}
  EditorTunnelCommand:
    Description: Forward the private n8n editor to http://localhost:8080 on your machine
    Value: !Sub >-
      aws ssm start-session --region ${AWS::Region} --target ${LabInstance}
      --document-name AWS-StartPortForwardingSession
      --parameters portNumber=8080,localPortNumber=8080
