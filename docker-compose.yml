# Secured n8n AI agent lab. Local use only.
# Only the proxy publishes a port, and only on 127.0.0.1.

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped

services:
  proxy:
    <<: *hardening
    image: nginx:1.27-alpine
    cap_add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./proxy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    networks: [frontend, backend]
    depends_on: [n8n]

  n8n:
    <<: *hardening
    image: n8nio/n8n:1.123.89
    entrypoint: ["/bin/sh", "/lab/init.sh"]
    environment:
      # Secrets come from .env (run ./setup.sh). Nothing secret is stored in the repo.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run ./setup.sh first}
      PORTAL_WEBHOOK_KEY: ${PORTAL_WEBHOOK_KEY:?run ./setup.sh first}
      CRM_AGENT_KEY: ${CRM_AGENT_KEY:?run ./setup.sh first}
      LLM_API_KEY: ${LLM_API_KEY:?run ./setup.sh first}
      N8N_LISTEN_ADDRESS: 0.0.0.0
      WEBHOOK_URL: http://localhost:8080/
      N8N_PROXY_HOPS: "1"
      # Plain http on localhost only. Use https and set this to true anywhere else.
      N8N_SECURE_COOKIE: "false"
      # Hardening
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_RUNNERS_ENABLED: "true"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.ssh","n8n-nodes-base.readWriteFile","n8n-nodes-base.localFileTrigger"]'
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Keep as little customer data in execution logs as possible.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "72"
      GENERIC_TIMEZONE: UTC
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/init.sh:/lab/init.sh:ro
      - ./n8n/workflows:/lab/workflows:ro
    networks: [backend]
    depends_on: [mock-crm, mock-llm]

  mock-crm:
    <<: *hardening
    build: ./mocks
    command: ["python", "crm.py"]
    read_only: true
    environment:
      CRM_AGENT_KEY: ${CRM_AGENT_KEY:?run ./setup.sh first}
      CRM_ADMIN_KEY: ${CRM_ADMIN_KEY:?run ./setup.sh first}
    networks: [backend]

  mock-llm:
    <<: *hardening
    build: ./mocks
    command: ["python", "llm.py"]
    read_only: true
    environment:
      LLM_API_KEY: ${LLM_API_KEY:?run ./setup.sh first}
    networks: [backend]

networks:
  frontend: {}
  # No route to the internet for n8n and the mock services.
  backend:
    internal: true

volumes:
  n8n_data: {}
