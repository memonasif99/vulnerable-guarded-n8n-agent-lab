# Public TLS listener on 8443, used by docker-compose.public.yml.
# Only the support-agent webhook is reachable here. The n8n editor is not:
# reach it through the localhost-only listener on 8080 (for example over an
# SSM port-forwarding session).
server {
  listen 8443 ssl;
  http2 on;

  ssl_certificate     /etc/nginx/certs/lab.crt;
  ssl_certificate_key /etc/nginx/certs/lab.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:TLS:1m;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  location = /webhook/support-agent {
    limit_except POST { deny all; }
    limit_req zone=webhook burst=10 nodelay;
    proxy_pass http://n8n:5678;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }

  location / { return 404; }
}
