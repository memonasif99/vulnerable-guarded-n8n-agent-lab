# Single entry point. Adds rate limits, a body size cap and basic headers
# in front of n8n, which has no built-in webhook rate limiting.
worker_processes 1;
events { worker_connections 256; }

http {
  server_tokens off;
  client_max_body_size 16k;

  limit_req_zone $binary_remote_addr zone=webhook:1m rate=30r/m;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # Extra servers, such as the public TLS listener in proxy/public.conf,
  # are mounted here by docker-compose.public.yml. Nothing is here by default.
  include /etc/nginx/lab.d/*.conf;

  server {
    listen 8080;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Only the one production webhook path is exposed. Test webhooks are not.
    location = /webhook/support-agent {
      limit_except POST { deny all; }
      limit_req zone=webhook burst=10 nodelay;
      proxy_pass http://n8n:5678;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 30s;
    }
    location ~ ^/webhook(-test)?/ { return 404; }

    # Editor UI for the lab admin (bound to localhost in docker-compose).
    location / {
      client_max_body_size 16m;
      proxy_pass http://n8n:5678;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
}
